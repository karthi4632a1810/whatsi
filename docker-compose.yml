# Mongo data lives on the host at ./data/mongo — rebuilds and
# `docker compose down` do NOT wipe it. Only delete that folder if you
# intentionally want a fresh database.

services:
  mongo:
    image: mongo:7
    container_name: whatsi-mongo
    ports:
      - "3002:27017"
    volumes:
      # Host bind mount = safe across rebuild / recreate / down
      - ./data/mongo:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsi-backend
    ports:
      - "2002:5001"
    env_file:
      - .env
    environment:
      PORT: "5001"
      MONGODB_URI: mongodb://mongo:27017/whatsi
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsi-frontend
    ports:
      - "1002:80"
    depends_on:
      - backend
    restart: unless-stopped
